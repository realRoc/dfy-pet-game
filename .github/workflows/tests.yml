name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # 含动作动画的真解码测试（tests/test_clips.py），没装上 PyAV 会跳过，这里先确认装上了
      - run: python -c "import clips; assert clips.AVAILABLE"
      - run: python -m unittest discover -s tests -v

  # 爬塔的规则测试（vitest）、类型检查 + 打包，再确认提交的 content/tower 和现在的源码、锁定依赖打出来的一字不差
  tower:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tower/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run release
      - name: content/tower 是最新打包
        run: |
          git diff --stat --exit-code -- ../content/tower || {
            echo "::error::content/tower 和源码打出来的不一致：在 tower/ 里跑 npm run release 再提交 content/tower/"
            exit 1
          }
