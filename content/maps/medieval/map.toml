# 异世界中世纪小岛：参考 B 站 UP 主「自由人家的大红鹅」的动森岛建（大红鹅岛），设计见 docs/medieval-map-design/。
# 主城在正中台地上，四周一圈河；北边港口、薰衣草田、古城遗迹，东北紫霓湖和湖心岛，
# 湖与东河之间是陶俑小路，东边女巫森林，南边沙滩，西边社区和田野。
#
# 路线用 [[road]]：沿 points 画平滑道路，nodes 里的格子沿路等距排开，节点 id = 道路 id + 两位序号。
# 多条道路 from 同一个节点就是岔路，写在前面的是默认方向。没想好放什么的格子先用 blank（空白格）。
# 镜头从斜上方看（tilt 是地面纵向压缩比例），建筑、树和角色直立着画，前后互相遮挡。

name = "中世纪小岛"
subtitle = "大红鹅岛"
start = "c00"
canvas = [3800, 2800]
window = [1080, 709]
zoom = 0.7
tilt = 0.72
tile = 96
fish_h = 120
dice = "cream"
tile_style = "sprite"
path_width = 50
art_dir = "medieval"

# ---------- 路线 ----------

[[road]]
id = "c"
zone = "主城"
points = [[1650, 2250], [1680, 2050], [1550, 1800], [1350, 1550], [1300, 1300], [1400, 1050], [1450, 900], [1450, 800], [1450, 650]]
nodes = ["start", "city", "blank", "blank", "city", "chest", "blank", "city", "story", "blank", "blank", "blank", "fork"]

