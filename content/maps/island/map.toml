# 环岛日记：一座比窗口大很多的岛，镜头跟着大肥鱼走。
# 世界坐标是画布像素（canvas 3600×2600），窗口默认 1080×709，一次只看到一部分。
#
# 路线用 [[road]] 描述：沿 points 画一条平滑道路，nodes 里的格子沿路等距排开，
# 节点 id = 道路 id + 两位序号（a00、a01……）。from / to 把道路接到别的节点上；
# 多条道路 from 同一个节点就是岔路，写在前面的是默认方向。
# 建筑、树木等是 content/art/island/ 下的贴图（Codex image_gen 生成，见 tools/import_art.py）。

name = "环岛日记"
subtitle = "环岛日记"
start = "a00"
canvas = [3600, 2600]
window = [1080, 709]
zoom = 0.7
tile = 96
fish_h = 120
dice = "cream"
tile_style = "sprite"
path_width = 46
art_dir = "island"

# ---------- 路线 ----------

[[road]]
id = "a"
zone = "海边小屋"
points = [[620, 2150], [520, 1980], [470, 1780], [520, 1580], [620, 1400], [660, 1230], [760, 1080]]
nodes = ["start", "supply", "rest", "fishing", "supply", "chest", "story", "supply", "fork"]

