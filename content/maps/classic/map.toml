# 经典外圈：8×6 网格的 24 格环，从左下角出发逆时针走。
# cell = [列, 行] 是网格坐标；自由地图改用 pos = [x, y]（0~1 归一化）。
# 没写 next 时连到下一个节点，loop = true 让最后一个连回第一个。
# 节点顺序也是旧存档 board_pos 的下标顺序，不要随意调换。

name = "经典外圈"
subtitle = "经典外圈"
start = "m00"
grid = [8, 6]
canvas = [760, 740]
grid_area = [68, 120, 624, 468]   # 8×78, 6×78；上面留给角色和顶栏，下面留给骰子托盘
tile = 78
dice = "classic"
tile_style = "card"
loop = true

node = [
  { id = "m00", type = "start",   cell = [0, 5] },
  { id = "m01", type = "fish",    cell = [1, 5] },
