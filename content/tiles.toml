# ---------- 中世纪小岛：特殊地点 ----------
# 事件积木：coins / say / expression（表情 key、动作动画名或 random；动作动画见 content/clips/clips.json）/ move（正数前进、负数后退）/ warp（传送到某类格子）/ skip_next / weight

[types.city]
name = "主城"
icon = "🏰"
color = "#E8A68C"
desc = "集市、吟游诗人和面包房"
events = [
  { coins = 2, say = "帮集市商人吆喝了一嗓子，赚了 2 小鱼干" },
  { expression = "happy", say = "广场上的吟游诗人给大肥鱼唱了首歌～" },
  { coins = -1, say = "面包房的可颂太香了，没忍住 -1" },
  { expression = "舞狮头", say = "集市上在舞狮，大肥鱼也顶着狮头蹦起来！" },
]

[types.gyroid]
name = "陶俑小路"
icon = "🏺"
color = "#E3A877"
desc = "陶俑会一起摇摆，偶尔把你往前推"
events = [
  { expression = "random", say = "陶俑们咕噜咕噜一起摇摆，大肥鱼也跟着跳" },
  { coins = 1, say = "挖出一个小陶俑，卖给博物馆 +1" },
  { move = 1, say = "陶俑咕噜一声，把你往前推了一格" },
]

[types.ruins]
name = "古城遗迹"
icon = "🏛️"
color = "#B9AFA3"
desc = "能挖到古钱币，也可能踩到机关"
events = [
  { coins = 3, say = "在断墙底下挖到古钱币 +3" },
  { move = -2, expression = "shocked", say = "踩到机关了！被石球追着退了两格" },
  { expression = "shocked", say = "那尊石像……刚才是不是动了一下？" },
]

[types.witch]
