  { coins = -2, expression = "cry", say = "喝了魔药变成青蛙，花 2 小鱼干才变回来" },
  { expression = "confused", say = "坩埚咕嘟咕嘟……好像什么也没发生" },
  { expression = "变鸽子", say = "女巫教了个戏法：帽子里变出鸽子！" },
]

