# 格子类型：外观 + 落地事件
# 落地时从 events 里随机抽一条：coins 加减小鱼干，say 是台词，skip_next 让下回合暂停。
# symbol 是石板上画的矢量符号（stone 风格地图用），desc 是悬停时显示的说明。
# 钓鱼、医院、商店、像素、森林的玩法还没做，先只说一句话，不发占位奖励。

[types.start]
name = "起点"
icon = "🏁"
color = "#FFD666"
symbol = "flag"
desc = "经过起点 +3 小鱼干"

[types.mystery]
name = "问号"
icon = "❓"
color = "#78D7CD"
symbol = "question"
desc = "随机做一个表情"
random_expression = true

[types.rest]
name = "休息"
icon = "🛋️"
color = "#C8BEF5"
symbol = "bench"
desc = "坐一会儿，说句话"
events = [
  { say = "躺一会儿，心情回满～" },
  { say = "大肥鱼坐的住" },
]

[types.chest]
name = "宝箱"
icon = "🎁"
color = "#FFC878"
symbol = "chest"
desc = "开宝箱拿小鱼干"
events = [
  { coins = 3, say = "宝箱里是钻石？！+3" },
  { coins = 1, say = "开出一个小发卡 +1" },
  { coins = 2, say = "金币闪闪 +2" },
]

